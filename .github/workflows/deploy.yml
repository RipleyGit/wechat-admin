name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: wechat-admin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build API JAR
        working-directory: api
        run: mvn -q -DskipTests package

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/target/wx-api.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    # 回滚到最初的部署方式：直连阿里云 VPS（公网服务器），不再经跳板机到 NAS。
    # 部署路径 /opt/wechat-admin，应用以 systemd 服务 wechat-admin 运行，
    # Nginx 提供前端并反代 /wx/ 到 127.0.0.1:18088。
    # （2026-11-28 由跳板机 + NAS 方案回滚；原始设计见 4194f0f。）
    timeout-minutes: 30
    steps:
      - name: Download web artifact
        id: download_web
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: release/web

      - name: Download API artifact
        id: download_api
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: release/api

      # 直连云服务器部署。缺任何一个 secret 都尽早失败，避免部署到错误地址。
      # DEPLOY_SSH_PRIVATE_KEY 是部署用户私钥的完整内容（含 BEGIN/END 行），
      # DEPLOY_KNOWN_HOSTS 是 ssh-keyscan 的输出；对应公钥要装进部署用户
      # ~/.ssh/authorized_keys（部署用户见 DEPLOY_USER，不要用 root）。
      - name: Validate deploy configuration
        id: validate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=''
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_PORT" ] || missing="$missing DEPLOY_PORT"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_PATH" ] || missing="$missing DEPLOY_PATH"
          [ -n "$DEPLOY_SSH_PRIVATE_KEY" ] || missing="$missing DEPLOY_SSH_PRIVATE_KEY"
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || missing="$missing DEPLOY_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::error::缺少必要的部署 Secrets:$missing"
            exit 1
          fi

      # 密钥与主机密钥都走 secret，不做 ssh-keyscan。
      - name: Configure deployment SSH key
        id: configure_ssh
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release files
        id: upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          # 直连云服务器：runner 直接 SSH 到 DEPLOY_HOST，不再经跳板机。
          # BatchMode 禁止任何交互式提示；ServerAlive 让链路真死时快速失败。
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          DEPLOY_PORT="${DEPLOY_PORT:-2232}"
          TARGET="$DEPLOY_USER@$DEPLOY_HOST"

          ssh -p "$DEPLOY_PORT" $SSH_OPTS "$TARGET" \
            "mkdir -p '$DEPLOY_PATH/.deploy/$RELEASE_ID/api' '$DEPLOY_PATH/.deploy/$RELEASE_ID/web'"

          # rsync 直传；--partial 让中断后可断点续传，每步最多重试 3 次
          for attempt in 1 2 3; do
            if rsync -az --delete --partial --timeout=120 -e "ssh -p $DEPLOY_PORT $SSH_OPTS" \
              release/web/ "$TARGET:$DEPLOY_PATH/.deploy/$RELEASE_ID/web/"; then
              break
            fi
            echo "web 上传第 $attempt 次失败，重试"
            [ "$attempt" -lt 3 ] || { echo '::error::web 上传失败：3 次均未成功'; exit 1; }
            sleep 5
          done
          for attempt in 1 2 3; do
            if rsync -az --partial --timeout=120 -e "ssh -p $DEPLOY_PORT $SSH_OPTS" \
              release/api/wx-api.jar "$TARGET:$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar"; then
              break
            fi
            echo "api jar 上传第 $attempt 次失败，重试"
            [ "$attempt" -lt 3 ] || { echo '::error::api jar 上传失败：3 次均未成功'; exit 1; }
            sleep 5
          done

          # 校验远端文件完整（jar 字节数一致，web 有 index.html）
          local_size=$(wc -c < release/api/wx-api.jar | tr -d ' ')
          ssh -p "$DEPLOY_PORT" $SSH_OPTS "$TARGET" \
            "test -s '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar' && test -f '$DEPLOY_PATH/.deploy/$RELEASE_ID/web/index.html' && test \"\$(wc -c < '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar' | tr -d ' ')\" = '$local_size'" \
            || { echo '::error::远端文件校验失败：jar 大小不一致或文件缺失'; exit 1; }
          echo "上传完成（web + api jar $local_size 字节）"

      # 应用以 systemd 服务 wechat-admin 运行（/etc/systemd/system/wechat-admin.service），
      # 配置在 /etc/wechat-admin/wechat-admin.env；Nginx 提供前端并反代 /wx/ 到 127.0.0.1:18088。
      # 健康检查在服务器本机执行，127.0.0.1 指向服务器自身。
      - name: Activate release
        id: activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          SSH_OPTS="-i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=3"
          DEPLOY_PORT="${DEPLOY_PORT:-2232}"
          ssh -p "$DEPLOY_PORT" $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
            test -s '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar'
            test -f '$DEPLOY_PATH/.deploy/$RELEASE_ID/web/index.html'
            rm -rf '$DEPLOY_PATH/web.previous'
            test ! -e '$DEPLOY_PATH/web' || mv '$DEPLOY_PATH/web' '$DEPLOY_PATH/web.previous'
            mv '$DEPLOY_PATH/.deploy/$RELEASE_ID/web' '$DEPLOY_PATH/web'
            test ! -e '$DEPLOY_PATH/wechat-admin.previous.jar' || rm -f '$DEPLOY_PATH/wechat-admin.previous.jar'
            test ! -e '$DEPLOY_PATH/wechat-admin.jar' || mv '$DEPLOY_PATH/wechat-admin.jar' '$DEPLOY_PATH/wechat-admin.previous.jar'
            mv '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar' '$DEPLOY_PATH/wechat-admin.jar'
            systemctl restart wechat-admin
            systemctl is-active --quiet wechat-admin
            ready=0
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:18088/wx/notify/deploy-success' -X POST \
                -H 'Content-Type: application/json' -H 'X-Notify-Secret: x' -d '{}' || true)
              if [ \"\$code\" != '000' ] && [ -n \"\$code\" ]; then ready=1; break; fi
              sleep 2
            done
            [ \"\$ready\" -eq 1 ] || { echo 'service did not become ready in time'; exit 1; }
            rm -rf '$DEPLOY_PATH/.deploy/$RELEASE_ID'"

      # 通知走通用推送网关：请求头里的公众号推送密钥决定发到哪个公众号，
      # 地址里的通道标识决定用哪套收件人和文案（在后台「消息推送」页面配置）
      - name: Notify success via WeChat
        if: success()
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          payload = json.dumps({
              "project": os.environ.get('PROJECT', ''),
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              # 模板消息的 thing 字段上限 20 字符，截断后含省略号也要在这个数内
              "commit_short": commit_msg[:19] + '…' if len(commit_msg) > 20 else commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/notify/deploy-success-template',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Notify-Secret': os.environ.get('NOTIFY_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode('utf-8')
                  print('Notify response:', body)
                  # 网关的业务错误是 HTTP 200 + JSON 里的 code，要看 code 才知道发没发出去；
                  # code=200 但一个都没发成功（没匹配到收件人、超出 48 小时窗口等）也要提示
                  result = json.loads(body)
                  data = result.get('data') or {}
                  if result.get('code') != 200:
                      print(f"::warning::部署通知未发出：{result.get('msg')}")
                  elif data.get('skipped'):
                      print('::warning::部署通知通道已停用，未发送')
                  elif not data.get('successCount') or data.get('failCount'):
                      print(f"::warning::部署通知成功 {data.get('successCount')}/{data.get('recipientCount')}：{data.get('errorMsg') or ''}")
          except urllib.error.HTTPError as e:
              print(f'::warning::部署通知 HTTP 错误：{e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'::warning::部署通知失败：{e}')
          PYEOF

      - name: Notify failure via WeChat
        if: failure() || cancelled()
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_DOWNLOAD_WEB: ${{ steps.download_web.outcome }}
          STEP_DOWNLOAD_API: ${{ steps.download_api.outcome }}
          STEP_VALIDATE: ${{ steps.validate.outcome }}
          STEP_CONFIGURE_SSH: ${{ steps.configure_ssh.outcome }}
          STEP_UPLOAD: ${{ steps.upload.outcome }}
          STEP_ACTIVATE: ${{ steps.activate.outcome }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          step_map = {
              'STEP_DOWNLOAD_WEB':   ('下载前端构件', ''),
              'STEP_DOWNLOAD_API':   ('下载后端构件', ''),
              'STEP_VALIDATE':       ('校验部署配置', ''),
              'STEP_CONFIGURE_SSH':  ('配置部署 SSH 密钥', ''),
              'STEP_UPLOAD':         ('上传发布文件到云服务器', ''),
              'STEP_ACTIVATE':       ('激活新版本并重启服务', ''),
          }
          failed_step = '未知步骤'
          for env_key, (name, err_detail) in step_map.items():
              if os.environ.get(env_key, '') in ('failure', 'cancelled'):
                  failed_step = name
                  if err_detail:
                      failed_step += f'\n错误：{err_detail[:200]}'
                  break
          payload = json.dumps({
              "project": os.environ.get('PROJECT', ''),
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              # 模板消息的 thing 字段上限 20 字符，截断后含省略号也要在这个数内
              "commit_short": commit_msg[:19] + '…' if len(commit_msg) > 20 else commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
              "failed_step": failed_step,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/notify/deploy-failure-template',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Notify-Secret': os.environ.get('NOTIFY_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode('utf-8')
                  print('Notify response:', body)
                  result = json.loads(body)
                  data = result.get('data') or {}
                  if result.get('code') != 200:
                      print(f"::warning::部署通知未发出：{result.get('msg')}")
                  elif data.get('skipped'):
                      print('::warning::部署通知通道已停用，未发送')
                  elif not data.get('successCount') or data.get('failCount'):
                      print(f"::warning::部署通知成功 {data.get('successCount')}/{data.get('recipientCount')}：{data.get('errorMsg') or ''}")
          except urllib.error.HTTPError as e:
              print(f'::warning::部署通知 HTTP 错误：{e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'::warning::部署通知失败：{e}')
          PYEOF

  # 把每次部署的结果以纯文本发布到 MQTT（主题 github/wechat-admin），格式与微信部署通知一致。
  # 独立跑在 GitHub 托管 runner 上，不依赖 NAS runner 的 Python 环境；
  # build 失败时 deploy 会被跳过，这个 job 用 always() 仍然执行并上报失败原因。
  # 凭据走 GitHub Actions secrets（MQTT_USERNAME / MQTT_PASSWORD），不要写进文件。
  notify-mqtt:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paho-mqtt
        run: python3 -m pip install --quiet paho-mqtt==2.1.0

      - name: Publish deploy result to MQTT
        # 和微信通知一样：MQTT 推送失败不影响部署结论，只在 run 页面留一条 warning
        continue-on-error: true
        env:
          MQTT_URL: wss://mqtt.bleem.site:443/mqtt
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_TOPIC: github/wechat-admin
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import datetime
          import os
          import sys
          from urllib.parse import urlparse

          import paho.mqtt.client as mqtt

          build_result = os.environ.get('BUILD_RESULT', '')
          deploy_result = os.environ.get('DEPLOY_RESULT', '')
          if build_result != 'success':
              status, failed_stage = 'failure', '构建（build）'
          elif deploy_result == 'success':
              status, failed_stage = 'success', ''
          elif deploy_result == 'cancelled':
              status, failed_stage = 'cancelled', '部署（deploy）'
          else:
              status, failed_stage = 'failure', '部署（deploy）'

          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          # 纯文本没有 thing 字段那 20 字的限制，比微信模板版多留一个字
          commit_short = commit_msg[:20] + '…' if len(commit_msg) > 21 else commit_msg
          deploy_time = datetime.datetime.now(
              datetime.timezone(datetime.timedelta(hours=8))
          ).strftime('%Y-%m-%d %H:%M:%S')

          # 推纯文本而不是 JSON：内容和微信部署通知一致，订阅端直接可读
          if status == 'success':
              title = f'✅ {commit_short} 部署成功'
          elif status == 'cancelled':
              title = f'⚠️ {commit_short} 部署取消'
          else:
              title = f'❌ {commit_short} 部署失败'
          lines = [
              title,
              f"项目：{os.environ.get('PROJECT', '')}",
              f"分支：{os.environ.get('BRANCH', '')}",
              f"提交：{commit_msg}",
              f"作者：{os.environ.get('ACTOR', '')}",
              f"时间：{deploy_time}",
          ]
          if failed_stage:
              stage_label = '中断阶段' if status == 'cancelled' else '失败步骤'
              lines.append(f'{stage_label}：{failed_stage}')
          if status != 'success':
              lines.append(f"日志：{os.environ.get('RUN_URL', '')}")
          content = '\n'.join(lines)

          url = urlparse(os.environ['MQTT_URL'])
          client = mqtt.Client(
              mqtt.CallbackAPIVersion.VERSION2,
              client_id='gha-wechat-admin-' + os.environ.get('GITHUB_RUN_ID', '0'),
              transport='websockets',
          )
          client.ws_set_options(path=url.path or '/mqtt')
          if url.scheme == 'wss':
              client.tls_set()
          client.username_pw_set(os.environ['MQTT_USERNAME'], os.environ['MQTT_PASSWORD'])
          client.on_connect = lambda c, u, flags, rc, props: print(f'MQTT connected: {rc}')

          try:
              client.connect(url.hostname, url.port or (443 if url.scheme == 'wss' else 80), keepalive=30)
              client.loop_start()
              # QoS1 + retain：等 broker 的 puback 再退出；retain 让订阅端一连上就能看到最近一次结果
              info = client.publish(os.environ['MQTT_TOPIC'], content, qos=1, retain=True)
              info.wait_for_publish(timeout=15)
              print(f"MQTT 已发送到 {os.environ['MQTT_TOPIC']}:\n{content}")
          except Exception as e:
              print(f'::warning::MQTT 推送失败：{e}')
              sys.exit(1)
          finally:
              client.disconnect()
              client.loop_stop()
          PYEOF
