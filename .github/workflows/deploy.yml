name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: wechat-admin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build API JAR
        working-directory: api
        run: mvn -q -DskipTests package

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/target/wx-api.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Download web artifact
        id: download_web
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: release/web

      - name: Download API artifact
        id: download_api
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: release/api

      - name: Configure deployment SSH key
        id: configure_ssh
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload release files
        id: upload
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/.deploy/$RELEASE_ID/api' '$DEPLOY_PATH/.deploy/$RELEASE_ID/web'"
          rsync -az --delete -e "ssh -p $DEPLOY_PORT" \
            release/web/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.deploy/$RELEASE_ID/web/"
          rsync -az -e "ssh -p $DEPLOY_PORT" \
            release/api/wx-api.jar "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar"

      - name: Activate release
        id: activate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -eu
            test -s '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar'
            test -f '$DEPLOY_PATH/.deploy/$RELEASE_ID/web/index.html'
            rm -rf '$DEPLOY_PATH/web.previous'
            test ! -e '$DEPLOY_PATH/web' || mv '$DEPLOY_PATH/web' '$DEPLOY_PATH/web.previous'
            mv '$DEPLOY_PATH/.deploy/$RELEASE_ID/web' '$DEPLOY_PATH/web'
            test ! -e '$DEPLOY_PATH/wechat-admin.previous.jar' || rm -f '$DEPLOY_PATH/wechat-admin.previous.jar'
            test ! -e '$DEPLOY_PATH/wechat-admin.jar' || mv '$DEPLOY_PATH/wechat-admin.jar' '$DEPLOY_PATH/wechat-admin.previous.jar'
            mv '$DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar' '$DEPLOY_PATH/wechat-admin.jar'
            systemctl restart wechat-admin
            systemctl is-active --quiet wechat-admin
            ready=0
            for i in \$(seq 1 30); do
              code=\$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/wx/deploy/webhook -X POST \
                -H 'Content-Type: application/json' -H 'X-Webhook-Secret: x' -d '{}' || true)
              if [ \"\$code\" != '000' ] && [ -n \"\$code\" ]; then ready=1; break; fi
              sleep 2
            done
            [ \"\$ready\" -eq 1 ] || { echo 'service did not become ready in time'; exit 1; }
            rm -rf '$DEPLOY_PATH/.deploy/$RELEASE_ID'"

      - name: Notify success via WeChat
        if: success()
        continue-on-error: true
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = os.environ.get('COMMIT_MSG', '').splitlines()[0]
          payload = json.dumps({
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "status": "success",
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/deploy/webhook',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Webhook-Secret': os.environ.get('DEPLOY_WEBHOOK_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Deploy webhook response:', resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print(f'Deploy webhook HTTP error: {e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'Deploy webhook error: {e}')
          PYEOF

      - name: Notify failure via WeChat
        if: failure() || cancelled()
        continue-on-error: true
        env:
          DEPLOY_WEBHOOK_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_DOWNLOAD_WEB: ${{ steps.download_web.outcome }}
          STEP_DOWNLOAD_API: ${{ steps.download_api.outcome }}
          STEP_CONFIGURE_SSH: ${{ steps.configure_ssh.outcome }}
          STEP_UPLOAD: ${{ steps.upload.outcome }}
          STEP_ACTIVATE: ${{ steps.activate.outcome }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = os.environ.get('COMMIT_MSG', '').splitlines()[0]
          step_map = {
              'STEP_DOWNLOAD_WEB':   ('下载前端构件', ''),
              'STEP_DOWNLOAD_API':   ('下载后端构件', ''),
              'STEP_CONFIGURE_SSH':  ('配置部署 SSH 密钥', ''),
              'STEP_UPLOAD':         ('上传发布文件到服务器', ''),
              'STEP_ACTIVATE':       ('激活新版本并重启服务', ''),
          }
          failed_step = '未知步骤'
          for env_key, (name, err_detail) in step_map.items():
              if os.environ.get(env_key, '') in ('failure', 'cancelled'):
                  failed_step = name
                  if err_detail:
                      failed_step += f'\n错误：{err_detail[:200]}'
                  break
          payload = json.dumps({
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "status": "failure",
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
              "failed_step": failed_step,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/deploy/webhook',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Webhook-Secret': os.environ.get('DEPLOY_WEBHOOK_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  print('Deploy webhook response:', resp.read().decode('utf-8'))
          except urllib.error.HTTPError as e:
              print(f'Deploy webhook HTTP error: {e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'Deploy webhook error: {e}')
          PYEOF
