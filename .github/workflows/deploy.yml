name: Build and Deploy

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: wechat-admin-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web console
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven

      - name: Build API JAR
        working-directory: api
        run: mvn -q -DskipTests package

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: api/target/wx-api.jar
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    # 自托管 runner 就在 NAS 本机上：构建仍在 GitHub 托管 runner 上做，
    # deploy 只做下载构件 + 本地拷贝 + 本地重启，不再走 Tailscale/DERP/SSH
    runs-on: [self-hosted, nas]
    environment: production
    # runner 不在线时任务会排队等，15 分钟没跑起来就失败，不无限挂着
    timeout-minutes: 15
    steps:
      - name: Download web artifact
        id: download_web
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: release/web

      - name: Download API artifact
        id: download_api
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: release/api

      # 迁移到 NAS 后，原来指向云服务器的 DEPLOY_HOST/DEPLOY_USER/DEPLOY_PATH/DEPLOY_PORT
      # 已全部改为 NAS_ 前缀；缺任何一个 NAS_* secret 都尽早失败，避免继续部署到旧地址
      # NAS_DEPLOY_PATH / NAS_RESTART_COMMAND 仍走 secrets（只是路径和命令，
      # 不再含 SSH/Tailscale 凭据）；部署目录必须已挂载进 runner 容器，
      # 且路径和这里的 NAS_DEPLOY_PATH 完全一致
      - name: Validate NAS deploy configuration
        id: validate
        env:
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          NAS_RESTART_COMMAND: ${{ secrets.NAS_RESTART_COMMAND }}
        run: |
          missing=''
          [ -n "$NAS_DEPLOY_PATH" ] || missing="$missing NAS_DEPLOY_PATH"
          [ -n "$NAS_RESTART_COMMAND" ] || missing="$missing NAS_RESTART_COMMAND"
          if [ -n "$missing" ]; then
            echo "::error::缺少必要的 NAS 部署配置:$missing"
            exit 1
          fi
          [ -d "$NAS_DEPLOY_PATH" ] || { echo "::error::部署目录不存在: $NAS_DEPLOY_PATH（检查 runner 容器的挂载路径是否和这个一致）"; exit 1; }

      - name: Upload release files
        id: upload
        env:
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          # 自托管 runner 就在 NAS 上：构件从 GitHub 直下到 runner 工作目录，
          # 再本地 cp 到部署目录，不再走 Tailscale/SSH，也不再需要分块、重试和超时
          set -e
          rm -rf "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID"
          mkdir -p "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/api" "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/web"
          echo "== 拷贝 web（$(du -sh release/web | cut -f1)）=="
          cp -r release/web/. "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/web/"
          echo "== 拷贝 api jar（$(du -sh release/api/wx-api.jar | cut -f1)）=="
          cp release/api/wx-api.jar "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar"
          test -s "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar"
          test -f "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/web/index.html"
          echo "拷贝完成"

      # DSM 没有 systemd，原来的 systemctl restart / is-active 已移除。
      # 重启与服务状态检查统一交给 NAS_RESTART_COMMAND（在 NAS 上执行，失败必须返回非 0），例如：
      #   sudo /volume1/docker/wechat-admin/restart.sh
      #   docker restart wechat-admin
      #   sudo synopkg restart wechat-admin
      # 健康检查在 NAS 本机执行，127.0.0.1 指向 NAS 自身（与原 workflow 一致：
      # 原来也是通过 ssh 在服务器本机探测，并非公网探测）。
      # 服务若跑在 Docker 中，需确认端口已映射到宿主机；
      # 想验证公网链路可把 NAS_HEALTHCHECK_URL 改成公网地址，但必须先确认域名已切到 NAS。
      - name: Activate release
        id: activate
        env:
          NAS_DEPLOY_PATH: ${{ secrets.NAS_DEPLOY_PATH }}
          NAS_RESTART_COMMAND: ${{ secrets.NAS_RESTART_COMMAND }}
          NAS_HEALTHCHECK_URL: ${{ secrets.NAS_HEALTHCHECK_URL }}
          RELEASE_ID: ${{ github.sha }}
        run: |
          if [ -z "${NAS_RESTART_COMMAND:-}" ]; then
            echo '::error::NAS_RESTART_COMMAND secret 未配置：DSM 没有 systemd，必须指定服务重启命令'
            exit 1
          fi
          # 注意：runner 跑在容器里，这里的 127.0.0.1 是容器自己，不是 NAS 本机；
          # 健康检查默认打 NAS 的 Tailscale IP
          HEALTHCHECK_URL="${NAS_HEALTHCHECK_URL:-http://100.97.151.65:18088/wx/notify/deploy-success}"
          set -eu
          test -s "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar"
          test -f "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/web/index.html"
          rm -rf "$NAS_DEPLOY_PATH/web.previous"
          test ! -e "$NAS_DEPLOY_PATH/web" || mv "$NAS_DEPLOY_PATH/web" "$NAS_DEPLOY_PATH/web.previous"
          mv "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/web" "$NAS_DEPLOY_PATH/web"
          test ! -e "$NAS_DEPLOY_PATH/wechat-admin.previous.jar" || rm -f "$NAS_DEPLOY_PATH/wechat-admin.previous.jar"
          test ! -e "$NAS_DEPLOY_PATH/wechat-admin.jar" || mv "$NAS_DEPLOY_PATH/wechat-admin.jar" "$NAS_DEPLOY_PATH/wechat-admin.previous.jar"
          mv "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID/api/wx-api.jar" "$NAS_DEPLOY_PATH/wechat-admin.jar"
          $NAS_RESTART_COMMAND
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTHCHECK_URL" -X POST \
              -H 'Content-Type: application/json' -H 'X-Notify-Secret: x' -d '{}' || true)
            if [ "$code" != '000' ] && [ -n "$code" ]; then ready=1; break; fi
            sleep 2
          done
          [ "$ready" -eq 1 ] || { echo 'service did not become ready in time'; exit 1; }
          rm -rf "$NAS_DEPLOY_PATH/.deploy/$RELEASE_ID"

      # 通知走通用推送网关：请求头里的公众号推送密钥决定发到哪个公众号，
      # 地址里的通道标识决定用哪套收件人和文案（在后台「消息推送」页面配置）
      - name: Notify success via WeChat
        if: success()
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          payload = json.dumps({
              "project": os.environ.get('PROJECT', ''),
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              # 模板消息的 thing 字段上限 20 字符，截断后含省略号也要在这个数内
              "commit_short": commit_msg[:19] + '…' if len(commit_msg) > 20 else commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/notify/deploy-success-template',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Notify-Secret': os.environ.get('NOTIFY_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode('utf-8')
                  print('Notify response:', body)
                  # 网关的业务错误是 HTTP 200 + JSON 里的 code，要看 code 才知道发没发出去；
                  # code=200 但一个都没发成功（没匹配到收件人、超出 48 小时窗口等）也要提示
                  result = json.loads(body)
                  data = result.get('data') or {}
                  if result.get('code') != 200:
                      print(f"::warning::部署通知未发出：{result.get('msg')}")
                  elif data.get('skipped'):
                      print('::warning::部署通知通道已停用，未发送')
                  elif not data.get('successCount') or data.get('failCount'):
                      print(f"::warning::部署通知成功 {data.get('successCount')}/{data.get('recipientCount')}：{data.get('errorMsg') or ''}")
          except urllib.error.HTTPError as e:
              print(f'::warning::部署通知 HTTP 错误：{e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'::warning::部署通知失败：{e}')
          PYEOF

      - name: Notify failure via WeChat
        if: failure() || cancelled()
        continue-on-error: true
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_DOWNLOAD_WEB: ${{ steps.download_web.outcome }}
          STEP_DOWNLOAD_API: ${{ steps.download_api.outcome }}
          STEP_VALIDATE: ${{ steps.validate.outcome }}
          STEP_TAILSCALE: ${{ steps.tailscale.outcome }}
          STEP_CONFIGURE_SSH: ${{ steps.configure_ssh.outcome }}
          STEP_UPLOAD: ${{ steps.upload.outcome }}
          STEP_ACTIVATE: ${{ steps.activate.outcome }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.error, datetime
          deploy_time = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')
          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          step_map = {
              'STEP_DOWNLOAD_WEB':   ('下载前端构件', ''),
              'STEP_DOWNLOAD_API':   ('下载后端构件', ''),
              'STEP_VALIDATE':       ('校验 NAS 部署配置', ''),
              'STEP_TAILSCALE':      ('接入 Tailscale 网络', ''),
              'STEP_CONFIGURE_SSH':  ('配置部署 SSH 密钥', ''),
              'STEP_UPLOAD':         ('上传发布文件到 NAS', ''),
              'STEP_ACTIVATE':       ('激活新版本并重启服务', ''),
          }
          failed_step = '未知步骤'
          for env_key, (name, err_detail) in step_map.items():
              if os.environ.get(env_key, '') in ('failure', 'cancelled'):
                  failed_step = name
                  if err_detail:
                      failed_step += f'\n错误：{err_detail[:200]}'
                  break
          payload = json.dumps({
              "project": os.environ.get('PROJECT', ''),
              "branch": os.environ.get('BRANCH', ''),
              "commit_msg": commit_msg,
              # 模板消息的 thing 字段上限 20 字符，截断后含省略号也要在这个数内
              "commit_short": commit_msg[:19] + '…' if len(commit_msg) > 20 else commit_msg,
              "actor": os.environ.get('ACTOR', ''),
              "run_url": os.environ.get('RUN_URL', ''),
              "deploy_time": deploy_time,
              "failed_step": failed_step,
          }, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(
              'https://wechat.bleem.site/wx/notify/deploy-failure-template',
              data=payload,
              headers={
                  'Content-Type': 'application/json; charset=utf-8',
                  'X-Notify-Secret': os.environ.get('NOTIFY_SECRET', '').strip(),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(req) as resp:
                  body = resp.read().decode('utf-8')
                  print('Notify response:', body)
                  result = json.loads(body)
                  data = result.get('data') or {}
                  if result.get('code') != 200:
                      print(f"::warning::部署通知未发出：{result.get('msg')}")
                  elif data.get('skipped'):
                      print('::warning::部署通知通道已停用，未发送')
                  elif not data.get('successCount') or data.get('failCount'):
                      print(f"::warning::部署通知成功 {data.get('successCount')}/{data.get('recipientCount')}：{data.get('errorMsg') or ''}")
          except urllib.error.HTTPError as e:
              print(f'::warning::部署通知 HTTP 错误：{e.code} {e.reason}')
              print('Response body:', e.read().decode('utf-8', errors='replace'))
          except Exception as e:
              print(f'::warning::部署通知失败：{e}')
          PYEOF

  # 把每次部署的结果发布到 MQTT（主题 github/wechat-admin），方便在订阅端实时看效果。
  # 独立跑在 GitHub 托管 runner 上，不依赖 NAS runner 的 Python 环境；
  # build 失败时 deploy 会被跳过，这个 job 用 always() 仍然执行并上报失败原因。
  # 凭据走 GitHub Actions secrets（MQTT_USERNAME / MQTT_PASSWORD），不要写进文件。
  notify-mqtt:
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install paho-mqtt
        run: python3 -m pip install --quiet paho-mqtt==2.1.0

      - name: Publish deploy result to MQTT
        # 和微信通知一样：MQTT 推送失败不影响部署结论，只在 run 页面留一条 warning
        continue-on-error: true
        env:
          MQTT_URL: wss://mqtt.bleem.site:443/mqtt
          MQTT_USERNAME: ${{ secrets.MQTT_USERNAME }}
          MQTT_PASSWORD: ${{ secrets.MQTT_PASSWORD }}
          MQTT_TOPIC: github/wechat-admin
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          PROJECT: ${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PYEOF'
          import datetime
          import json
          import os
          import sys
          from urllib.parse import urlparse

          import paho.mqtt.client as mqtt

          build_result = os.environ.get('BUILD_RESULT', '')
          deploy_result = os.environ.get('DEPLOY_RESULT', '')
          if build_result != 'success':
              status, failed_stage = 'failure', '构建（build）'
          elif deploy_result == 'success':
              status, failed_stage = 'success', ''
          elif deploy_result == 'cancelled':
              status, failed_stage = 'cancelled', '部署（deploy）'
          else:
              status, failed_stage = 'failure', '部署（deploy）'

          commit_msg = (os.environ.get('COMMIT_MSG') or '').split('\n', 1)[0].strip()
          payload = json.dumps({
              'status': status,
              'project': os.environ.get('PROJECT', ''),
              'repo': os.environ.get('REPO', ''),
              'branch': os.environ.get('BRANCH', ''),
              'commit': (os.environ.get('COMMIT_SHA') or '')[:7],
              'commit_msg': commit_msg,
              'actor': os.environ.get('ACTOR', ''),
              'run_url': os.environ.get('RUN_URL', ''),
              'deploy_time': datetime.datetime.now(
                  datetime.timezone(datetime.timedelta(hours=8))
              ).strftime('%Y-%m-%d %H:%M:%S'),
              'build_result': build_result,
              'deploy_result': deploy_result,
              'failed_stage': failed_stage,
          }, ensure_ascii=False)

          url = urlparse(os.environ['MQTT_URL'])
          client = mqtt.Client(
              mqtt.CallbackAPIVersion.VERSION2,
              client_id='gha-wechat-admin-' + os.environ.get('GITHUB_RUN_ID', '0'),
              transport='websockets',
          )
          client.ws_set_options(path=url.path or '/mqtt')
          if url.scheme == 'wss':
              client.tls_set()
          client.username_pw_set(os.environ['MQTT_USERNAME'], os.environ['MQTT_PASSWORD'])
          client.on_connect = lambda c, u, flags, rc, props: print(f'MQTT connected: {rc}')

          try:
              client.connect(url.hostname, url.port or (443 if url.scheme == 'wss' else 80), keepalive=30)
              client.loop_start()
              # QoS1 + retain：等 broker 的 puback 再退出；retain 让订阅端一连上就能看到最近一次结果
              info = client.publish(os.environ['MQTT_TOPIC'], payload, qos=1, retain=True)
              info.wait_for_publish(timeout=15)
              print(f"MQTT 已发送到 {os.environ['MQTT_TOPIC']}: {payload}")
          except Exception as e:
              print(f'::warning::MQTT 推送失败：{e}')
              sys.exit(1)
          finally:
              client.disconnect()
              client.loop_stop()
          PYEOF
