# Tomcat
server:
  tomcat:
    uri-encoding: UTF-8
    connection-timeout: 5000
    threads:
        max: 1000
        min-spare: 30
  port: ${SERVER_PORT:18088}
  servlet:
    context-path: /wx

debug: false

spring:
  profiles:
    active: ${PROFILE_ACTIVE:dev} #此处由maven的环境选择决定，参考：https://www.jianshu.com/p/b7c75b0c364c
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
      enabled: true
  mvc:
    throw-exception-if-no-handler-found: true
    pathmatch:
      matching-strategy: ant_path_matcher #解决springboot2.6与swagger兼容性问题
  task:
    scheduling:
      pool:
        size: 5
  redis:
    lettuce:
      pool:
        enabled: true
        max-idle: 60
        min-idle: 6
        max-wait: 500
        time-between-eviction-runs: 6000

# Nacos 配置中心（nacos-config-spring-boot-starter，不引 Spring Cloud）
# 详细说明见 .docs/nacos-config.md。data-id 固定 wechat-admin.yml，public 命名空间、DEFAULT_GROUP。
# remote-first 默认 false：Nacos 里的键不覆盖本地 application*.yml，只做增量开关；
# 要让远端覆盖（含热更新）再置 true。账号密码只从环境变量注入，不写进仓库。
nacos:
  config:
    enabled: ${NACOS_CONFIG_ENABLED:true}
    server-addr: ${NACOS_ADDR:dsm.bleem.site:8848}
    namespace: ${NACOS_NAMESPACE:}
    group: ${NACOS_GROUP:DEFAULT_GROUP}
    username: ${NACOS_USERNAME:}
    password: ${NACOS_PASSWORD:}
    data-id: wechat-admin.yml
    type: yaml
    auto-refresh: ${NACOS_AUTO_REFRESH:true}
    remote-first: ${NACOS_REMOTE_FIRST:false}
    bootstrap:
      # 与 enabled 同一个开关：NACOS_CONFIG_ENABLED=false 时彻底关闭拉取
      enable: ${NACOS_CONFIG_ENABLED:true}


#mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  type-aliases-package: site.bleem.wechat.modules.*.entity
  type-handlers-package: site.bleem.wechat.common.handler
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ID_WORKER:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: AUTO
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'

renren:
  # APP模块，是通过jwt认证的，如果要使用APP模块，则需要修改【加密秘钥】
  jwt:
    # 加密秘钥
    secret: kF3`eF0|bD0!eA1#gE0!eE3_hD0@kJ0#[niefy@qq.com]
    # token有效时长，7天，单位秒
    expire: 604800
    header: token
wx:
  mp:
    # 自动回复消息发送间隔（毫秒），适当增加间隔可提升用户体验
    autoReplyInterval: 1000
  # 门户小程序。
  # appid 与 AppSecret 已搬到 wx_account 的 mini_appid / mini_secret 两列，
  # 在运营台「选择工作公众号 → 配置」里维护，不再用环境变量
  # （见 db/migrations/20261026_add_wx_account_mini.sql）。
  # /wxMiniUser/** 是公开接口（ShiroConfig 里 /** 是 anon），所以留着下面这个开关。
  mini:
    allow-openid-login: ${WX_MINI_ALLOW_OPENID_LOGIN:true}
    # 小程序用户关联服务号（MiniLinkService）。
    # 网页授权回调的对外根地址，要带 /wx；域名须同时配成服务号「网页授权域名」和小程序「业务域名」
    link-base-url: ${WX_MINI_LINK_BASE_URL:https://wechat.bleem.site/wx}
    # 扫码关联后回流小程序卡片的封面图（服务号永久素材 media_id）。留空则改发一段文字
    link-card-thumb-media-id: ${WX_MINI_LINK_CARD_THUMB_MEDIA_ID:}

deploy:
  webhook:
    appid: ${DEPLOY_WEBHOOK_APPID:wxfd938c6a7ced4eab}
    secret: ${DEPLOY_WEBHOOK_SECRET:wechat-admin}
    tag-name: ${DEPLOY_WEBHOOK_TAG_NAME:develop}

# 私信媒体转存。access-key/secret-key 故意不给默认值：
# 没配就让 MinioConfig 跳过初始化（私信降级为纯文字），不要把凭证写进仓库
minio:
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  bucket: ${MINIO_BUCKET:wechat}
  secure: ${MINIO_SECURE:false}
  # 对外访问前缀，走 nginx 的 /minio/ 反代；留空则回退到 endpoint 直连
  public-base-url: ${MINIO_PUBLIC_BASE_URL:}
logging:
  level:
    me:
      chanjar: debug

